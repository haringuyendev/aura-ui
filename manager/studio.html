<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f766e'/%3E%3Cpath d='M12 5l1.9 4.6L18.5 12l-4.6 1.9L12 18.5l-1.9-4.6L5.5 12l4.6-2.4z' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --fg: #1c1c1a; --muted: #6b6b66; --faint: #9a9a93;
  --line: #e4e3df; --soft: #efeeea; --accent: #0f766e; --accent-fg: #ffffff; --accent-soft: #e3f1ef;
  --warn: #9a5b00; --warn-soft: #fbf1e1; --danger: #b42318; --danger-soft: #fdecea; --ok: #15803d;
  --user: #eceae4; --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 4px 16px rgb(0 0 0 / .06);
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121211; --panel: #1a1a19; --fg: #ececea; --muted: #a3a39c; --faint: #75756f;
  --line: #2c2c2a; --soft: #232322; --accent: #2dd4bf; --accent-fg: #062b27; --accent-soft: #123a35;
  --warn: #f5b454; --warn-soft: #3a2a10; --danger: #f87171; --danger-soft: #3b1715; --ok: #4ade80;
  --user: #262624; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .3);
} }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { flex: none; }

.app { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; grid-template-rows: minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }

/* ---- chat ---- */
.chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.project { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.spacer { flex: 1; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); }
.icon-btn:hover { background: var(--soft); color: var(--fg); }
.icon-btn:disabled { opacity: .45; cursor: default; background: transparent; }
.icon-btn[aria-pressed="true"] { background: var(--soft); color: var(--fg); border-color: var(--line); }

.messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.msg-user { align-self: flex-end; max-width: 88%; background: var(--user); padding: 8px 12px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; word-wrap: break-word; }
.msg-ai { display: flex; flex-direction: column; gap: 8px; }
.msg-ai .text { word-wrap: break-word; }
.text p { margin: 0 0 8px; } .text p:last-child { margin-bottom: 0; }
.text ul, .text ol { margin: 0 0 8px; padding-left: 20px; }
.text code { font-family: var(--mono); font-size: 12.5px; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
.text pre { margin: 0 0 8px; background: var(--soft); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.text pre code { background: none; padding: 0; }
.steps { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.steps > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 7px 10px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
.steps > summary::-webkit-details-marker { display: none; }
.steps > summary .chev { transition: transform .15s; }
.steps[open] > summary .chev { transform: rotate(90deg); }
.steps ol { list-style: none; margin: 0; padding: 0 10px 8px; display: flex; flex-direction: column; gap: 3px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.step span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step.sub { padding-left: 18px; }
.step .st-ok { color: var(--ok); } .step .st-error { color: var(--danger); }
.spin { flex: none; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.aura-note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--warn); background: var(--warn-soft); padding: 7px 10px; border-radius: 8px; }
.approve { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); box-shadow: var(--shadow); }
.approve b { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.approve .row { display: flex; gap: 8px; }
.meta { font-size: 12px; color: var(--faint); }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.empty-chat { margin: auto 0; display: flex; flex-direction: column; gap: 14px; padding: 8px 4px; }
.empty-chat h2 { margin: 0; font-size: 20px; letter-spacing: -.02em; line-height: 1.3; }
.empty-chat p { margin: 0; color: var(--muted); }
.ideas { display: flex; flex-direction: column; gap: 6px; }
.idea { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 12px; color: var(--fg); }
.idea:hover { border-color: var(--accent); background: var(--accent-soft); }

.banner { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--warn-soft); color: var(--warn); font-size: 12.5px; border-bottom: 1px solid var(--line); }
.banner[hidden] { display: none; }
.banner.missing { flex-direction: column; align-items: stretch; gap: 6px; color: var(--danger); background: var(--danger-soft); }
.create-card .banner.missing { border: 0; border-radius: 10px; padding: 10px 14px; }
.banner.missing code { color: var(--fg); background: var(--panel); padding: 1px 6px; border-radius: 5px; user-select: all; }
.banner code { font-family: var(--mono); }
.banner .btn { flex: none; color: var(--fg); }
.attachments { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 2px 6px; }
.attachments:empty { display: none; }
.att { position: relative; display: inline-flex; align-items: center; gap: 6px; max-width: 200px; height: 40px; padding: 0 8px 0 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 12px; color: var(--muted); }
.att img, .att .ficon { width: 32px; height: 32px; border-radius: 5px; object-fit: cover; flex: none; background: var(--soft); display: grid; place-items: center; font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.att span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; padding: 0; font-size: 11px; line-height: 1; }
.att .x:hover { color: var(--fg); }
.att.err { border-color: var(--danger); color: var(--danger); }
.msg-files { align-self: flex-end; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 88%; margin-bottom: -12px; }
.msg-files a { display: block; text-decoration: none; color: inherit; }
.msg-files a.att { display: inline-flex; }
.msg-files img { display: block; max-width: 180px; max-height: 120px; border-radius: 10px; border: 1px solid var(--line); object-fit: cover; }
.msg-files .att { height: 36px; background: var(--user); border-color: transparent; }
.chat.dropping::after, .create-form.dropping::after { content: 'Thả file vào đây'; position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 12px; background: color-mix(in oklab, var(--accent-soft) 85%, transparent); display: grid; place-items: center; font-weight: 600; color: var(--accent); pointer-events: none; z-index: 5; }
.chat, .create-form { position: relative; }
.composer { flex: none; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
.box { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 8px; transition: border-color .15s, box-shadow .15s; }
.box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.box textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; padding: 4px 6px; max-height: 200px; min-height: 44px; line-height: 1.5; }
.box-foot { display: flex; align-items: center; gap: 8px; }
.where { font-size: 12px; color: var(--muted); padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 550; white-space: nowrap; }
.btn:hover { background: var(--soft); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-primary:disabled { opacity: .4; cursor: default; filter: none; }
.btn-stop { background: var(--fg); border-color: var(--fg); color: var(--panel); }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }

/* ---- preview ---- */
.preview { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.field { height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 10px; outline: 0; }
.field:focus { border-color: var(--accent); }
.address { display: flex; align-items: center; flex: 1; min-width: 180px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding-left: 10px; }
.address:focus-within { border-color: var(--accent); }
.address .origin { color: var(--faint); font-size: 13px; white-space: nowrap; }
.address input { flex: 1; min-width: 60px; border: 0; outline: 0; background: transparent; height: 100%; padding: 0 8px 0 1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--bg); }
.seg button { height: 26px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--shadow); }
.stage { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; padding: 0; }
.stage.framed { padding: 16px; }
.frame-wrap { transform-origin: top center; background: #fff; flex: none; }
.stage.framed .frame-wrap { border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line); }
iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; }
.stage-empty { margin: auto; text-align: center; max-width: 380px; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 24px; }
.stage-empty h3 { margin: 0; font-size: 16px; }
.stage-empty p { margin: 0; color: var(--muted); }
.stage-empty code { font-family: var(--mono); font-size: 12.5px; background: var(--soft); padding: 1px 6px; border-radius: 5px; }
.err { color: var(--danger); font-size: 13px; }

/* ---- new app ---- */
.create { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
.create[hidden], .app[hidden], .progress[hidden] { display: none; }
.create-card { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 18px; }
.create-card .brand { font-size: 15px; }
.create-card h1 { margin: 0; font-size: 30px; line-height: 1.2; letter-spacing: -.025em; }
.create-card .lead { margin: 0; color: var(--muted); }
.create-form { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.create-form:focus-within { border-color: var(--accent); }
.create-form label { font-size: 12.5px; color: var(--muted); font-weight: 550; }
.create-form .field { width: 100%; }
.create-form textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px; outline: 0; line-height: 1.5; }
.create-form textarea:focus, .create-form .field:focus { border-color: var(--accent); }
.create-foot { display: flex; align-items: center; gap: 10px; }
.create-foot .where { padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.progress { list-style: none; margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
.progress li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress li.now { color: var(--fg); display: flex; align-items: center; gap: 8px; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; overflow: visible; }
  .chat { height: 70vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .preview { height: 80vh; }
  .seg .wide { display: none; }
}
</style>
</head>
<body>
<div class="create" id="create" hidden>
  <div class="create-card">
    <div class="brand"><span class="brand-mark"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6z"/></svg></span>Aura Studio</div>
    <h1>Mô tả app anh muốn dựng</h1>
    <p class="lead">Studio tạo app từ starter của Aura (React, shadcn, các block có sẵn), bật dev server, rồi agent dựng màn hình đầu tiên theo mô tả. Sau đó anh chat để sửa tiếp.</p>
    <div class="banner missing" id="cmissing" hidden></div>
    <form class="create-form" id="createform">
      <label for="cdesc">App này dùng để làm gì?</label>
      <textarea id="cdesc" placeholder="Ví dụ: Dashboard theo dõi lịch khám của phòng khám: số ca hôm nay, ca trễ giờ, danh sách bệnh nhân chờ, lọc theo bác sĩ"></textarea>
      <div class="chips" id="cideas"></div>
      <div class="attachments" id="catts"></div>
      <div><button class="btn btn-sm" id="cattach" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.3-2.4l7.9-7.9"/></svg>Đính kèm mockup, tài liệu yêu cầu…</button><input type="file" id="cfileinput" multiple hidden></div>
      <label for="cname">Tên thư mục</label>
      <input class="field" id="cname" spellcheck="false" placeholder="lich-kham">
      <div class="create-foot">
        <span class="where" id="cwhere"></span>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="cgo" type="submit" disabled>Tạo app</button>
      </div>
    </form>
    <ol class="progress" id="cprogress" hidden></ol>
    <div class="err" id="cerr"></div>
  </div>
</div>

<div class="app" id="main">
  <aside class="chat">
    <header class="chat-head">
      <div class="brand"><span class="brand-mark"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6z"/></svg></span>Aura Studio</div>
      <span class="project" id="project"></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="reset" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    </header>
    <div class="banner missing" id="missing" hidden></div>
    <div class="banner" id="pwbanner" hidden><span>Chưa có Playwright nên <code>aura verify</code> chưa mở được trang để kiểm tra.</span><button class="btn btn-sm" id="pwinstall" type="button">Cài Playwright</button></div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <form class="composer" id="composer">
      <div class="box">
        <div class="attachments" id="atts"></div>
        <textarea id="input" rows="2" placeholder="Mô tả thay đổi anh muốn, ví dụ: thêm bộ lọc theo trạng thái cho bảng đơn hàng"></textarea>
        <div class="box-foot">
          <button class="icon-btn" id="attach" type="button" title="Đính kèm file (ảnh, PDF, CSV…) — hoặc kéo thả, dán ảnh" aria-label="Đính kèm file"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.3-2.4l7.9-7.9"/></svg></button>
          <input type="file" id="fileinput" multiple hidden>
          <span class="where" id="where"></span>
          <span class="spacer"></span>
          <button class="btn btn-primary btn-sm" id="send" type="submit" disabled>Gửi
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
        </div>
      </div>
    </form>
  </aside>

  <main class="preview">
    <div class="toolbar">
      <select class="field" id="app" aria-label="App" hidden></select>
      <label class="address"><span class="origin" id="origin"></span><input id="path" list="routes" spellcheck="false" aria-label="Đường dẫn trang"></label>
      <datalist id="routes"></datalist>
      <div class="seg" role="group" aria-label="Khung xem">
        <button type="button" data-w="0" aria-pressed="true" title="Vừa khung">Vừa khung</button>
        <button type="button" data-w="1440" class="wide" title="Desktop 1440px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>1440</button>
        <button type="button" data-w="768" title="Tablet 768px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/></svg>768</button>
        <button type="button" data-w="390" title="Điện thoại 390px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>390</button>
      </div>
      <button class="icon-btn" id="reload" title="Tải lại" aria-label="Tải lại"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <a class="icon-btn" id="newtab" target="_blank" rel="noopener" title="Mở tab mới" aria-label="Mở tab mới"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a>
    </div>
    <div class="stage" id="stage"></div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id)
const S = { apps: [], app: '.', path: '/', routes: [], messages: [], running: false, width: 0, url: null }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const api = (p, body) => fetch(p, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })

const ICON = {
  ok: '<svg class="st-ok" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  error: '<svg class="st-error" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  run: '<i class="spin"></i>',
  chev: '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  shield: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:3px"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>',
}

/* Small markdown: paragraphs, lists, **bold**, `code`, ``` fences. */
function md(src) {
  const blocks = String(src).replace(/\r/g, '').split(/```(\w*)\n?([\s\S]*?)(?:```|$)/)
  let out = ''
  for (let i = 0; i < blocks.length; i += 3) {
    const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    const kind = (l) => /^\s*[-*•]\s/.test(l) ? 'ul' : /^\s*\d+[.)]\s/.test(l) ? 'ol' : 'p'
    for (const b of blocks[i].split(/\n{2,}/).filter((b) => b.trim())) {
      // runs of list lines and plain lines inside one block ("Đã sửa:\n- a\n- b")
      const runs = []
      for (const l of b.split('\n')) { const k = kind(l); runs.at(-1)?.k === k ? runs.at(-1).lines.push(l) : runs.push({ k, lines: [l] }) }
      out += runs.map((r) => r.k === 'p'
        ? `<p>${r.lines.map(inline).join('<br>')}</p>`
        : `<${r.k}>${r.lines.map((l) => `<li>${inline(l.replace(/^\s*(?:[-*•]|\d+[.)])\s/, ''))}</li>`).join('')}</${r.k}>`).join('')
    }
    if (blocks[i + 2] !== undefined) out += `<pre><code>${esc(blocks[i + 2].replace(/\n$/, ''))}</code></pre>`
  }
  return out
}

function renderReply(m, live) {
  const el = document.createElement('div')
  el.className = 'msg-ai'
  // consecutive tool steps → one collapsible group
  const groups = []
  for (const p of m.parts ?? []) {
    if (p.kind === 'tool') { const g = groups.at(-1); g?.kind === 'steps' ? g.items.push(p) : groups.push({ kind: 'steps', items: [p] }) }
    else groups.push(p)
  }
  groups.forEach((g, gi) => {
    if (g.kind === 'text') el.insertAdjacentHTML('beforeend', `<div class="text">${md(g.text)}</div>`)
    else if (g.kind === 'aura') el.insertAdjacentHTML('beforeend', `<div class="aura-note">${ICON.shield}<span>${esc(g.text)}</span></div>`)
    else if (g.kind === 'approve') {
      const file = g.name.includes('/')
      const card = document.createElement('div')
      card.className = 'approve'
      card.innerHTML = `<div>Agent muốn ${file ? 'tạo primitive mới' : 'thêm primitive'} <b>${esc(g.name)}</b> vào bộ UI dùng chung của dự án.</div>` + (g.decided
        ? `<div class="meta">${g.decided === 'yes' ? 'Anh đã đồng ý.' : 'Anh đã từ chối.'}</div>`
        : `<div class="row"><button class="btn btn-primary btn-sm" data-ok="1">Đồng ý thêm</button><button class="btn btn-sm" data-ok="0">Không, dùng cái có sẵn</button></div>`)
      card.querySelectorAll('button').forEach((b) => b.onclick = () => decide(g.name, b.dataset.ok === '1'))
      el.appendChild(card)
    } else if (g.kind === 'steps') {
      const running = g.items.some((t) => t.status === 'run')
      const last = gi === groups.length - 1
      const d = document.createElement('details')
      d.className = 'steps'
      d.open = (live && last) || g.items.length <= 2
      const n = g.items.filter((t) => !t.sub).length || g.items.length
      d.innerHTML = `<summary>${ICON.chev}${running ? ICON.run : ''}<span>${running ? 'Đang làm' : 'Đã làm'} ${n} bước</span></summary><ol>${g.items.map((t) => `<li class="step${t.sub ? ' sub' : ''}">${ICON[t.status] ?? ''}<span title="${esc(t.label)}">${esc(t.label)}</span></li>`).join('')}</ol>`
      el.appendChild(d)
    }
  })
  if (live && !(m.parts ?? []).some((p) => p.kind === 'text' && p === m.parts.at(-1))) el.insertAdjacentHTML('beforeend', '<span class="typing"><i></i><i></i><i></i></span>')
  if (m.meta && !live) {
    const bits = []
    if (m.meta.stopped) bits.push('Đã dừng')
    else if (!m.meta.ok) bits.push('Có lỗi')
    if (m.meta.ms) bits.push(`${Math.round(m.meta.ms / 1000)} giây`)
    if (m.meta.cost) bits.push(`$${m.meta.cost.toFixed(3)}`)
    if (bits.length) el.insertAdjacentHTML('beforeend', `<div class="meta">${bits.join(' · ')}</div>`)
  }
  return el
}

const IDEAS = ['Làm trang này gọn và dễ đọc hơn', 'Thêm bộ lọc theo trạng thái và ô tìm kiếm cho bảng', 'Hiển thị trạng thái bằng màu cho dễ nhận biết', 'Kiểm tra trang này trên điện thoại và sửa chỗ vỡ bố cục']

    box.innerHTML = `<div class="empty-chat"><h2>Anh muốn sửa gì trên giao diện?</h2><p>Nhắn yêu cầu bằng tiếng Việt. Agent sửa code trong repo, dùng component của dự án và chạy aura verify trước khi báo xong. Trang bên phải tự cập nhật.</p><div class="ideas">${IDEAS.map((i) => `<button class="idea" type="button">${esc(i)}</button>`).join('')}</div></div>`
    box.querySelectorAll('.idea').forEach((b) => b.onclick = () => { $('input').value = b.textContent; syncSend(); $('input').focus() })
    return
  }
  S.messages.forEach((m, i) => {
    if (m.role === 'user') {
      if (m.files?.length) box.insertAdjacentHTML('beforeend', `<div class="msg-files">${m.files.map((f) => /^image\//.test(f.type)
        ? `<a href="/api/file?id=${encodeURIComponent(f.id)}" target="_blank" rel="noopener"><img src="/api/file?id=${encodeURIComponent(f.id)}" alt="${esc(f.name)}"></a>`
        : `<a href="/api/file?id=${encodeURIComponent(f.id)}" target="_blank" rel="noopener" class="att">${fileIcon(f.name)}<span>${esc(f.name)}</span></a>`).join('')}</div>`)
      box.insertAdjacentHTML('beforeend', `<div class="msg-user">${esc(m.text)}</div>`)
    }
    else box.appendChild(renderReply(m, S.running && i === S.messages.length - 1))
  })
  if (atBottom || S.running) box.scrollTop = box.scrollHeight
}

/* ---- attachments ---- */
const fileIcon = (name) => `<i class="ficon">${esc((name.split('.').pop() || 'file').slice(0, 4))}</i>`
/** Upload queue for one composer: chips in `box`, files from a picker, drops on `zone` and pasted images. */
function attacher(box, input, zone, onChange) {
  let items = [] // { key, name, type, id?, error?, url? }
  const render = () => {
    box.innerHTML = items.map((f, i) => `<span class="att${f.error ? ' err' : ''}" title="${esc(f.error ?? f.name)}">${f.url ? `<img src="${f.url}" alt="">` : fileIcon(f.name)}${f.id || f.error ? '' : '<i class="spin"></i>'}<span>${esc(f.error ?? f.name)}</span><button type="button" class="x" data-i="${i}" aria-label="Bỏ ${esc(f.name)}">×</button></span>`).join('')
    box.querySelectorAll('.x').forEach((b) => b.onclick = () => { const [f] = items.splice(+b.dataset.i, 1); if (f?.url) URL.revokeObjectURL(f.url); render(); onChange() })
  }
  const add = async (fileList) => {
    for (const file of fileList) {
      if (items.length >= 10) break
      const f = { key: Math.random(), name: file.name || `anh-dan-${Date.now()}.png`, type: file.type, url: /^image\//.test(file.type) ? URL.createObjectURL(file) : null }
      if (file.size > 20e6) f.error = `${f.name}: lớn hơn 20MB`
      items.push(f); render(); onChange()
      if (f.error) continue
      try {
        const r = await fetch(`/api/upload?name=${encodeURIComponent(f.name)}`, { method: 'POST', headers: { 'content-type': 'application/octet-stream' }, body: file })
        const j = await r.json()
        if (!r.ok) throw new Error(j.error ?? `Lỗi ${r.status}`)
        Object.assign(f, { id: j.id, type: j.type, size: j.size })
      } catch (e) { f.error = `${f.name}: ${e.message}` }
      render(); onChange()
    }
  }
  input.addEventListener('change', () => { add([...input.files]); input.value = '' })
  let depth = 0
  zone.addEventListener('dragenter', (e) => { if (e.dataTransfer?.types.includes('Files')) { e.preventDefault(); depth++; zone.classList.add('dropping') } })
  zone.addEventListener('dragover', (e) => { if (e.dataTransfer?.types.includes('Files')) e.preventDefault() })
  zone.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; zone.classList.remove('dropping') } })
  zone.addEventListener('drop', (e) => { if (!e.dataTransfer?.files.length) return; e.preventDefault(); depth = 0; zone.classList.remove('dropping'); add([...e.dataTransfer.files]) })
  zone.addEventListener('paste', (e) => { const files = [...(e.clipboardData?.files ?? [])]; if (files.length) { e.preventDefault(); add(files) } })
  return {
    ready: () => items.filter((f) => f.id),
    busy: () => items.some((f) => !f.id && !f.error),
    /** Uploaded files for a message; clears the chips. */
    take() { const out = items.filter((f) => f.id).map(({ id, name, type, size }) => ({ id, name, type, size })); items.forEach((f) => f.url && URL.revokeObjectURL(f.url)); items = []; render(); return out },
  }
}
const chatFiles = attacher($('atts'), $('fileinput'), document.querySelector('.chat'), () => syncSend())
$('attach').addEventListener('click', () => $('fileinput').click())
const createFiles = attacher($('catts'), $('cfileinput'), $('createform'), () => {})
$('cattach').addEventListener('click', () => $('cfileinput').click())

/* ---- sending ---- */
function syncSend() {
  const b = $('send')
  if (S.running) { b.disabled = false; b.className = 'btn btn-stop btn-sm'; b.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>Dừng' }
  else { b.className = 'btn btn-primary btn-sm'; b.disabled = (!$('input').value.trim() && !chatFiles.ready().length) || chatFiles.busy(); b.innerHTML = 'Gửi <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>' }
  $('reset').disabled = S.running
}

async function send(text, files = chatFiles.take()) {
  if ((!text.trim() && !files.length) || S.running) return
  if (!text.trim()) text = 'Xem file đính kèm.'
  S.running = true
  const reply = { role: 'assistant', parts: [] }
  S.messages.push({ role: 'user', text, files }, reply)
  $('input').value = ''; autosize(); syncSend(); renderMessages()
  const width = S.width || Math.round($('stage').clientWidth)
  try {
    const res = await api('/api/chat', { text, app: S.app, path: S.path, width, files: files.map((f) => ({ id: f.id, name: f.name })) })
    if (!res.ok) throw new Error(res.status === 409 ? 'Agent đang chạy một yêu cầu khác.' : `Lỗi ${res.status}`)
    const reader = res.body.getReader(), dec = new TextDecoder()
    let buf = ''
    for (;;) {
      const { value, done } = await reader.read()
      if (done) break
      buf += dec.decode(value, { stream: true })
      let i
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2)
        if (chunk.startsWith('data: ')) onEvent(reply, JSON.parse(chunk.slice(6)))
      }
    }
  } catch (e) {
    reply.parts.push({ kind: 'text', text: `⚠️ ${e.message}` })
  }
  S.running = false
  syncSend(); renderMessages()
}

let edited = false
function onEvent(reply, e) {
  if (e.t === 'text') { const last = reply.parts.at(-1); last?.kind === 'text' && !e.fresh ? (last.text += e.text) : reply.parts.push({ kind: 'text', text: e.text }) }
  else if (e.t === 'tool') { reply.parts.push({ kind: 'tool', id: e.id, label: e.label, sub: e.sub, status: 'run' }); if (/^(Sửa|Tạo|Ghi) /.test(e.label)) edited = true }
  else if (e.t === 'tool_done') { const t = reply.parts.find((p) => p.id === e.id); if (t) t.status = e.status }
  else if (e.t === 'aura') reply.parts.push({ kind: 'aura', text: e.text })
  else if (e.t === 'approve') reply.parts.push({ kind: 'approve', name: e.name })
  else if (e.t === 'done') { Object.assign(reply, e.message); if (edited) reloadFrame(); edited = false }
  renderMessages()
}

async function decide(name, ok) {
  await api('/api/approve', { name, ok })
  for (const m of S.messages) for (const p of m.parts ?? []) if (p.kind === 'approve' && p.name === name) p.decided = ok ? 'yes' : 'no'
  renderMessages()
  send(ok ? `Đồng ý thêm ${name}, anh làm tiếp đi.` : `Không thêm ${name}. Dùng component đang có trong dự án.`)
}

const appInfo = () => S.apps.find((a) => a.dir === S.app)
function renderPreview() {
  const a = appInfo(), stage = $('stage')
  S.url = a?.url ?? null
  $('origin').textContent = S.url ? S.url.replace(/^https?:\/\//, '') : 'chưa có dev server'
  $('path').value = S.path
  $('newtab').href = S.url ? S.url + S.path : '#'
  $('where').textContent = `Đang xem ${S.path}${S.width ? ` · ${S.width}px` : ''}`
  if (!S.url) {
    stage.className = 'stage'
    stage.innerHTML = a
      ? `<div class="stage-empty"><h3>Chưa có dev server cho ${esc(a.name)}</h3><p>Studio sẽ chạy <code>${esc(a.dev)}</code> trong <code>${esc(a.dir)}</code> rồi hiện trang ở đây.</p><button class="btn btn-primary" id="startdev">Chạy dev server</button><div class="err" id="deverr"></div></div>`
      : `<div class="stage-empty"><h3>Không tìm thấy app để xem trước</h3><p>Cần một <code>package.json</code> có script <code>dev</code>. Anh vẫn chat để sửa code được.</p></div>`
    $('startdev')?.addEventListener('click', startDev)
    return
  }
  stage.className = 'stage' + (S.width ? ' framed' : '')
  stage.innerHTML = `<div class="frame-wrap" id="wrap"><iframe id="frame" title="Xem trước" src="${esc(S.url + S.path)}"></iframe></div>`
  layoutFrame()
  $('frame').addEventListener('load', () => {
    // Same-origin pages (rare) tell us their path; otherwise the address bar keeps what was typed.
    try { const p = $('frame').contentWindow.location.pathname; if (p && p !== S.path) { S.path = p; $('path').value = p; saveView() } } catch {}
  })
}
function layoutFrame() {
  const wrap = $('wrap'), stage = $('stage')
  if (!wrap) return
  if (!S.width) { wrap.style.cssText = 'width:100%;height:100%'; return }
  const pad = 32, availW = stage.clientWidth - pad, availH = stage.clientHeight - pad
  const scale = Math.min(1, availW / S.width)
  wrap.style.cssText = `width:${S.width}px;height:${availH / scale}px;transform:scale(${scale})`
}
function reloadFrame() { const f = $('frame'); if (f) f.src = S.url + S.path }
function saveView() { api('/api/view', { app: S.app, path: S.path }) }

async function startDev() {
  const btn = $('startdev')
  btn.disabled = true; btn.innerHTML = '<i class="spin"></i> Đang chạy…'
  const r = await (await api('/api/dev', { app: S.app })).json()

  else { btn.disabled = false; btn.textContent = 'Thử lại'; $('deverr').textContent = r.error ?? 'Không chạy được dev server.' }

/* ---- new app ---- */
const CIDEAS = ['Dashboard doanh thu và đơn hàng cho chuỗi cửa hàng', 'Quản lý lịch khám và bệnh nhân chờ cho phòng khám', 'Trang quản trị nhân sự: danh sách, chấm công, nghỉ phép', 'Theo dõi tồn kho và cảnh báo hàng sắp hết']
const slugify = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').split('-').slice(0, 4).join('-')
let nameTouched = false
function showCreate(st) {
  $('main').hidden = true; $('create').hidden = false
  document.title = 'App mới · Aura Studio'
  const where = () => { $('cwhere').textContent = st.empty ? `Tạo trong ${st.base}` : `Tạo trong ${st.base}/${$('cname').value.trim() || '…'}` }
  if (st.empty) { $('cname').value = st.name; $('cname').disabled = true; nameTouched = true }
  $('cideas').innerHTML = CIDEAS.map((i) => `<button class="chip" type="button">${esc(i)}</button>`).join('')
  $('cideas').querySelectorAll('.chip').forEach((b) => b.onclick = () => { $('cdesc').value = b.textContent; sync(); $('cdesc').focus() })
  const sync = () => {
    if (!nameTouched) $('cname').value = slugify($('cdesc').value)
    $('cgo').disabled = !$('cdesc').value.trim() || !$('cname').value.trim()
    where()
  }
  $('cdesc').oninput = sync
  $('cname').oninput = () => { nameTouched = true; sync() }
  $('cdesc').onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('createform').requestSubmit() }
  $('createform').onsubmit = (e) => { e.preventDefault(); createApp() }
  where(); $('cdesc').focus()
}
async function createApp() {
  const desc = $('cdesc').value.trim(), name = $('cname').value.trim()
  if (createFiles.busy()) { $('cerr').textContent = 'Đợi file tải lên xong đã.'; return }
  $('cgo').disabled = true; $('cgo').innerHTML = '<i class="spin"></i> Đang tạo…'
  $('cdesc').disabled = $('cname').disabled = true
  $('cerr').textContent = ''
  const list = $('cprogress'); list.hidden = false; list.innerHTML = ''
  const log = (text) => {
    list.querySelector('.now')?.classList.remove('now')
    list.querySelector('.spin')?.remove()
    list.insertAdjacentHTML('beforeend', `<li class="now"><i class="spin"></i>${esc(text)}</li>`)
    list.scrollTop = list.scrollHeight
  }
  let ready = false
  try {
    const res = await api('/api/create', { name })
    const reader = res.body.getReader(), dec = new TextDecoder()
    let buf = ''
    for (;;) {
      const { value, done } = await reader.read()
      if (done) break
      buf += dec.decode(value, { stream: true })
      let i
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2)
        if (!chunk.startsWith('data: ')) continue
        const e = JSON.parse(chunk.slice(6))
        if (e.t === 'log') log(e.text)
        else if (e.t === 'error') throw new Error(e.text)
        else if (e.t === 'ready') ready = true
      }
    }
  } catch (e) { $('cerr').textContent = e.message }
  if (!ready) { $('cgo').disabled = false; $('cgo').textContent = 'Thử lại'; $('cdesc').disabled = false; return }
  $('create').hidden = true; $('main').hidden = false
  await load()
  send(desc, createFiles.take())
}

/* Programs missing on this machine (claude CLI, npm): what for and the install command. */
function showMissing(el, items) {
  el.hidden = !items?.length
  if (!items?.length) return
  el.innerHTML = items.map((m) => `<div>Thiếu <b>${esc(m.label)}</b> ${esc(m.why)}. Cài: <code>${esc(m.fix)}</code></div>`).join('') + '<div>Cài xong thì tắt Studio (Ctrl+C) và mở lại.</div>'
}

async function load() {
  const st = await (await api('/api/state')).json()
  showMissing($('missing'), st.missing); showMissing($('cmissing'), st.missing)
  if (st.mode === 'new') return showCreate(st)
  Object.assign(S, st)
  $('project').textContent = st.project
  document.title = `${st.project} · Aura Studio`
  const sel = $('app')
  sel.hidden = st.apps.length < 2
  sel.innerHTML = st.apps.map((a) => `<option value="${esc(a.dir)}"${a.dir === st.app ? ' selected' : ''}>${esc(a.name)}</option>`).join('')
  try { const w = Number(localStorage.getItem('aura-studio-width')); if (w) { S.width = w; document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', Number(x.dataset.w) === w)) } } catch {}
  $('pwbanner').hidden = st.playwright
  renderRoutes(); renderPreview(); renderMessages(); syncSend()
  if (st.running) $('messages').insertAdjacentHTML('beforeend', '<div class="meta">Agent đang chạy một yêu cầu từ tab khác…</div>')
}
load()
</script>
</body>
</html>
